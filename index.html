<!DOCTYPE html>
<html lang="en">

<head>
    <title>CANFORGENS &gt; Formatter</title>
    <meta charset="utf-8" />

    <link rel="dns-prefetch" href="https://www.canada.ca">
    <link rel="icon" href="https://www.canada.ca/etc/designs/canada/wet-boew/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4=" crossorigin="anonymous">

    <script type="importmap">
    {
        "imports": {
            "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
        }
    }
    </script>
</head>

<body>
    <main>

        <div class="container my-5">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="https://github.com/dnd-mdn">dnd-mdn</a></li>
                <li class="breadcrumb-item"><a href="../index.html">Tools</a></li>
                <li class="breadcrumb-item"><a href="../index.html?c=CANFORGENS">CANFORGENS</a></li>
                <li class="breadcrumb-item active">Formatter</li>
            </ol>

            <h1 class="h2">CANFORGENS - Formatter</h1>
            <p>Copy and paste the contents of the CANFORGEN text component below to format it into HTML.</p>

            <div class="mb-3">
                <label for="docx-input" class="form-label fw-semibold">Upload .docx</label>
                <input type="file" id="docx-input" class="form-control" accept=".docx">
                <div id="docx-error" class="text-danger small mt-1" style="display:none"></div>
            </div>

            <div class="mb-3">
                <label for="input" class="form-label fw-semibold">Plaintext input</label>
                <textarea id="input" class="form-control font-monospace" rows="12" placeholder="Paste plaintext list here, or upload a .docx above..."></textarea>
            </div>

            <button id="convert-btn" class="btn btn-primary mb-4">Convert</button>

            <div id="result" style="display:none">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold mb-0">HTML</label>
                            <button id="copy-btn" class="btn btn-sm btn-outline-secondary">Copy</button>
                        </div>
                        <textarea id="output" class="form-control font-monospace" rows="16" readonly></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Preview</label>
                        <div id="preview" class="border rounded p-3 overflow-auto" style="max-height: 400px"></div>
                    </div>
                </div>
            </div>

            <p class="mt-4">Version <code>2026-07-29</code></p>
        </div>
    </main>

    <script type="module" src="src/app.js"></script>
</body>

</html>
